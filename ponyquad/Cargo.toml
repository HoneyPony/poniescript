[package]
name = "ponyquad"
version = "0.1.0"
edition = "2024"

[lib]
# Note: This might have to be cdylib, actually, for wasm. Unclear.
# Also should be 'lib' if we want to link it with other Rust stuff...?
crate-type = ["staticlib", "lib"]

[dependencies]
libloading = "0.9.0"
log = { version = "0.4.29", features = ["release_max_level_off"] }
macroquad = { git = "https://github.com/HoneyPony/macroquad", features = ["backtrace", "log", "log-rs"] }
notify = "8.2.0"
poniescript-gc = { version = "0.1.0", path = "../poniescript-gc", features = ["single-threaded"] }
poniescript-rt = { version = "0.1.0", path = "../poniescript-rt" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

[features]
hotreload = ["poniescript-gc/hotreload"]
