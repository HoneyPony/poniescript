[package]
name = "poniescript-core"
version = "0.1.0"
edition = "2021"
build = "build/main.rs"

[dependencies]
anstream = "0.6.14"
anstyle = "1.0.7"
clap = { workspace = true }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel", "crossbeam-queue"] }
log = "0.4.28"
poni-arena = { version = "0.1.0", path = "../poni-arena" }
rustc-hash = "2.0.0"
ufmt = { version = "0.2.0", features = ["std"] }
